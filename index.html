<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC 筆順">
<title>ABC 筆順練習</title>
<style>
/* Layout: one-screen app. Top bar with letter picker + settings, big SVG tracing stage, status pill at bottom. */
:root{
  --bg:#fffbf2;          /* warm paper */
  --panel:#ffffff;
  --fg:#2b2a33;
  --muted:#8a8794;
  --line:#ece6d8;
  --guide:#e4e0d6;       /* letter outline (not yet traced) */
  --rule:#d9d2c3;        /* writing lines */
  --accent:#ff7a1a;
  --good:#22a06b;
  --warn:#e8a317;
  --bad:#e5484d;
  --shadow:0 6px 20px rgba(60,40,10,.10);
  --font:"Nunito","Heiti TC","PingFang TC","Hiragino Sans","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b22;--panel:#2a2731;--fg:#f4f1f8;--muted:#a7a2b3;--line:#3a3642;
    --guide:#45414f;--rule:#4a4656;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b22;--panel:#2a2731;--fg:#f4f1f8;--muted:#a7a2b3;--line:#3a3642;
  --guide:#45414f;--rule:#4a4656;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
}
#app{height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar .grow{flex:1}
.btn{font:inherit;font-weight:800;font-size:17px;color:var(--fg);background:var(--panel);border:2px solid var(--line);
  border-radius:14px;padding:10px 14px;min-height:46px;min-width:46px;cursor:pointer;box-shadow:var(--shadow)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{font:inherit;font-weight:800;font-size:16px;color:var(--muted);background:transparent;border:0;padding:10px 14px;min-height:46px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#letterName{font-size:34px;font-weight:900;letter-spacing:2px;min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
#strokeDots{display:flex;gap:6px;align-items:center}
#strokeDots i{width:12px;height:12px;border-radius:50%;background:var(--guide);display:block}
#strokeDots i.on{background:var(--accent)}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px 74px}
#svg{width:100%;height:100%;display:block;overflow:visible}
.rule{stroke:var(--rule);stroke-width:.5;fill:none}
.rule.mid{stroke-dasharray:2 2}
.guide{fill:none;stroke:var(--guide);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.done,.cur{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.trail{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
#status{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  font-size:26px;font-weight:900;padding:10px 26px;border-radius:999px;background:var(--panel);color:var(--muted);
  box-shadow:var(--shadow);white-space:nowrap;transition:background .15s,color .15s}
#status.good{background:var(--good);color:#fff}
#status.warn{background:var(--warn);color:#fff}
#status.bad{background:var(--bad);color:#fff}
#status.hint{background:var(--accent);color:#fff}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border-radius:24px;padding:20px;max-width:720px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.sheet h2{margin:0 0 12px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.grid button{font:inherit;font-weight:900;font-size:26px;min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.grid button small{font-size:18px;color:var(--muted);font-weight:700}
.grid button:active{transform:scale(.95)}
.grid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.sheet .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.sheet .tools .grow{flex:1}
.sheet .hint{color:var(--muted);font-size:15px;margin:0 0 12px}
#celebrate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
#celebrate .big{font-size:min(14vw,110px);font-weight:900;color:var(--accent);text-shadow:0 6px 0 rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
#celebrate .sub{font-size:28px;font-weight:800;color:var(--fg);background:var(--panel);padding:8px 22px;border-radius:999px;box-shadow:var(--shadow)}
.star{position:absolute;font-size:36px;animation:fall 1.6s ease-out forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(300px) rotate(300deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}
#status.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){#letterName{font-size:26px;min-width:64px}.btn,.seg button{font-size:14px;padding:8px 10px}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="btn" id="prevBtn" aria-label="上一個字母">◀</button>
    <div id="letterName">A</div>
    <button class="btn" id="nextBtn" aria-label="下一個字母">▶</button>
    <div id="strokeDots" aria-label="筆畫進度"></div>
    <div class="grow"></div>
    <div class="seg" id="modeSeg" role="group" aria-label="大小寫">
      <button data-v="upper" aria-pressed="true">大寫</button>
      <button data-v="lower" aria-pressed="false">小寫</button>
      <button data-v="both" aria-pressed="false">大小寫</button>
    </div>
    <div class="seg" id="speedSeg" role="group" aria-label="速度">
      <button data-v="0" aria-pressed="false">慢</button>
      <button data-v="1" aria-pressed="true">中</button>
      <button data-v="2" aria-pressed="false">快</button>
    </div>
    <button class="btn" id="shuffleBtn" aria-pressed="false" title="隨機順序">🔀</button>
    <button class="btn" id="soundBtn" aria-pressed="true" title="聲音">🔊</button>
    <button class="btn" id="demoBtn">看示範</button>
    <button class="btn" id="gridBtn">字母表</button>
    <button class="btn primary" id="againBtn">重來</button>
  </div>
  <div id="stage">
    <svg id="svg" viewBox="0 0 100 112" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g id="rules">
        <line class="rule" x1="4" y1="10" x2="96" y2="10"/>
        <line class="rule mid" x1="4" y1="44" x2="96" y2="44"/>
        <line class="rule" x1="4" y1="82" x2="96" y2="82"/>
      </g>
      <g id="gGuide"></g>
      <g id="gDone"></g>
      <path id="curPath" class="cur"/>
      <g id="gTrail"></g>
      <g id="startMark">
        <circle id="startRing" r="7" fill="none" stroke-width="1.6">
          <animate attributeName="r" values="6;8.5;6" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.35;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
        <circle id="startDot" r="5.2" fill="#fff" stroke-width="1.4"/>
        <text id="startNum" text-anchor="middle" dominant-baseline="central" font-size="6.5" font-weight="900" fill="#333"></text>
      </g>
      <g id="lead">
        <circle id="leadDot" r="4.6" stroke="#fff" stroke-width="1.3"/>
        <text id="hand" font-size="9" dx="4" dy="12" style="display:none">👆</text>
      </g>
    </svg>
    <div id="status">從 1 開始</div>
    <div id="celebrate" hidden></div>
  </div>
  <div id="gridOverlay" class="overlay" hidden>
    <div class="sheet">
      <h2>要練哪些字母？</h2>
      <p class="hint" id="gridHint">點一下勾選，可以選好幾個；都不選就是全部 26 個。</p>
      <div class="grid" id="grid"></div>
      <div class="tools">
        <button class="btn" id="selAll">全選</button>
        <button class="btn" id="selNone">清除</button>
        <span class="grow"></span>
        <button class="btn primary" id="gridStart">開始練習</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
// ---------- Stroke data (viewBox 100 x 112; cap top 10, x-height 44, baseline 82, descender 102) ----------
const UP = {
A:['M50 10 L22 82','M50 10 L78 82','M33 56 L67 56'],
B:['M30 10 L30 82','M30 10 L52 10 A22 18 0 0 1 52 46 L30 46','M30 46 L54 46 A24 18 0 0 1 54 82 L30 82'],
C:['M68 18 A28 36 0 1 0 68 74'],
D:['M28 10 L28 82','M28 10 L44 10 A34 36 0 0 1 44 82 L28 82'],
E:['M30 10 L30 82','M30 10 L74 10','M30 46 L66 46','M30 82 L74 82'],
F:['M30 10 L30 82','M30 10 L74 10','M30 46 L66 46'],
G:['M68 18 A28 36 0 1 0 78 52 L54 52'],
H:['M26 10 L26 82','M74 10 L74 82','M26 46 L74 46'],
I:['M50 10 L50 82','M30 10 L70 10','M30 82 L70 82'],
J:['M62 10 L62 64 A15 18 0 0 1 32 64'],
K:['M28 10 L28 82','M72 10 L28 52','M40 42 L74 82'],
L:['M30 10 L30 82 L74 82'],
M:['M22 82 L22 10','M22 10 L50 66','M50 66 L78 10','M78 10 L78 82'],
N:['M26 82 L26 10','M26 10 L74 82','M74 82 L74 10'],
O:['M50 10 A28 36 0 1 0 50 82 A28 36 0 1 0 50 10'],
P:['M30 10 L30 82','M30 10 L54 10 A22 20 0 0 1 54 50 L30 50'],
Q:['M50 10 A28 36 0 1 0 50 82 A28 36 0 1 0 50 10','M58 64 L80 86'],
R:['M30 10 L30 82','M30 10 L54 10 A22 19 0 0 1 54 48 L30 48','M50 48 L76 82'],
S:['M66.4 17.7 A20 18 0 1 0 50 46 A20 18 0 1 1 33.6 74.3'],
T:['M50 10 L50 82','M24 10 L76 10'],
U:['M26 10 L26 58 A24 24 0 0 0 74 58 L74 10'],
V:['M24 10 L50 82','M50 82 L76 10'],
W:['M18 10 L34 82','M34 82 L50 28','M50 28 L66 82','M66 82 L82 10'],
X:['M26 10 L74 82','M74 10 L26 82'],
Y:['M26 10 L50 50','M74 10 L50 50 L50 82'],
Z:['M26 10 L74 10 L26 82 L74 82']
};
const BOWL='M64.6 50.8 A19 19 0 1 0 64.6 75.2';
const LOW = {
a:[BOWL,'M69 44 L69 82'],
b:['M31 10 L31 82','M31 63 A19 19 0 0 1 69 63 A19 19 0 0 1 31 63'],
c:[BOWL],
d:[BOWL,'M69 10 L69 82'],
e:['M31 63 L69 63 A19 19 0 1 0 64.6 75.2'],
f:['M63.4 16.6 A10 10 0 0 0 44 20 L44 82','M30 44 L58 44'],
g:[BOWL,'M69 44 L69 88 A15 14 0 0 1 39 88'],
h:['M31 10 L31 82','M31 60 A19 16 0 0 1 69 60 L69 82'],
i:['M50 44 L50 82','M50 27 L50 31'],
j:['M58 44 L58 88 A13 14 0 0 1 32 88','M58 27 L58 31'],
k:['M32 10 L32 82','M66 44 L34 68','M46 59 L68 82'],
l:['M50 10 L50 82'],
m:['M24 44 L24 82','M24 58 A13 14 0 0 1 50 58 L50 82','M50 58 A13 14 0 0 1 76 58 L76 82'],
n:['M31 44 L31 82','M31 60 A19 16 0 0 1 69 60 L69 82'],
o:['M50 44 A19 19 0 1 0 50 82 A19 19 0 1 0 50 44'],
p:['M31 44 L31 102','M31 63 A19 19 0 0 1 69 63 A19 19 0 0 1 31 63'],
q:[BOWL,'M69 44 L69 102'],
r:['M36 44 L36 82','M36 60 A16 16 0 0 1 65.9 52'],
s:['M60.6 48.1 A13 9.5 0 1 0 50 63 A14 9.5 0 1 1 38.5 77.9'],
t:['M46 18 L46 72 A10 10 0 0 0 64.7 77','M32 44 L60 44'],
u:['M31 44 L31 66 A19 16 0 0 0 69 66 L69 44','M69 44 L69 82'],
v:['M30 44 L50 82','M50 82 L70 44'],
w:['M22 44 L36 82','M36 82 L50 50','M50 50 L64 82','M64 82 L78 44'],
x:['M32 44 L68 82','M68 44 L32 82'],
y:['M32 44 L50 82','M68 44 L48 90 Q44 102 32 98'],
z:['M32 44 L68 44 L32 82 L68 82']
};
const COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7'];
const DARK=['#b91c1c','#b45309','#15803d','#1d4ed8','#7e22ce'];
const SPEEDS=[26,40,58];     // fill speed, units/sec
const LEAD=16;               // how far the colour runs ahead of the finger
const TOL=10;                // finger tolerance (stroke is 11 wide)
const BACK=12, AHEAD=10, START_WIN=12, END_SLACK=4;

// ---------- DOM ----------
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const svg=$('svg'), gGuide=$('gGuide'), gDone=$('gDone'), curPath=$('curPath'), gTrail=$('gTrail');
const startMark=$('startMark'), startRing=$('startRing'), startDot=$('startDot'), startNum=$('startNum');
const leadG=$('lead'), leadDot=$('leadDot'), hand=$('hand'), statusEl=$('status'), stage=$('stage');
const meas=document.createElementNS(NS,'path'); meas.setAttribute('visibility','hidden'); svg.appendChild(meas);
function mk(tag,attrs){const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);return el;}

// ---------- Settings ----------
let settings={mode:'upper',speed:1,sound:true,shuffle:false,sel:[]};
try{Object.assign(settings,JSON.parse(localStorage.getItem('abc-trace')||'{}'));}catch(e){}
if(!Array.isArray(settings.sel))settings.sel=[];settings.sel=settings.sel.filter(n=>Number.isInteger(n)&&n>=0&&n<26);
function save(){try{localStorage.setItem('abc-trace',JSON.stringify(settings));}catch(e){}}

// ---------- State ----------
let idx=0, lower=false, strokes=[], si=0, cur=null;
let p=0, f=0, engaged=false, down=false, lastPt=null, demo=false, letterDone=false, demoWait=0;
let trailEl=null, trailPts='', lastStatusKey='';

function sample(d){
  meas.setAttribute('d',d);
  const L=meas.getTotalLength(), pts=[];
  for(let s=0;s<L;s+=0.5){const q=meas.getPointAtLength(s);pts.push({x:q.x,y:q.y,s});}
  const q=meas.getPointAtLength(L);pts.push({x:q.x,y:q.y,s:L});
  return {L,pts};
}
function ptAt(S,s){const i=Math.min(S.pts.length-1,Math.max(0,Math.round(s/0.5)));return S.pts[i];}
function nearest(S,pt,lo,hi){
  let best=null,bd=Infinity;
  const i0=Math.max(0,Math.floor(lo/0.5)), i1=Math.min(S.pts.length-1,Math.ceil(hi/0.5));
  for(let i=i0;i<=i1;i++){const q=S.pts[i];const dx=q.x-pt.x,dy=q.y-pt.y;const d=dx*dx+dy*dy;if(d<bd){bd=d;best=q;}}
  return best?{pt:best,d:Math.sqrt(bd)}:null;
}
function toSvg(cx,cy){const m=svg.getScreenCTM();const q=svg.createSVGPoint();q.x=cx;q.y=cy;return q.matrixTransform(m.inverse());}

function letterChar(){const c=String.fromCharCode(65+idx);return lower?c.toLowerCase():c;}

function loadLetter(){
  const ch=letterChar(); const data=lower?LOW[ch]:UP[ch];
  strokes=data.map((d,i)=>Object.assign({d,color:COLORS[i%5],dark:DARK[i%5]},sample(d)));
  gGuide.innerHTML='';gDone.innerHTML='';gTrail.innerHTML='';
  strokes.forEach(S=>gGuide.appendChild(mk('path',{d:S.d,class:'guide'})));
  $('letterName').textContent=String.fromCharCode(65+idx)+' '+String.fromCharCode(97+idx);
  const dots=$('strokeDots');dots.innerHTML='';strokes.forEach(()=>dots.appendChild(document.createElement('i')));
  letterDone=false; demo=false; hand.style.display='none'; $('celebrate').hidden=true;
  setStroke(0);
  speak(ch);
}
function setStroke(i){
  si=i; cur=strokes[i]; p=0; f=0; pull=0; engaged=false; offSince=0;
  curPath.setAttribute('d',cur.d); curPath.setAttribute('stroke',cur.color);
  curPath.style.strokeDasharray=cur.L+' '+(cur.L+2); curPath.style.strokeDashoffset=cur.L;
  const s0=cur.pts[0];
  startMark.style.display='';
  startRing.setAttribute('cx',s0.x);startRing.setAttribute('cy',s0.y);startRing.setAttribute('stroke',cur.color);
  startDot.setAttribute('cx',s0.x);startDot.setAttribute('cy',s0.y);startDot.setAttribute('stroke',cur.color);
  startNum.setAttribute('x',s0.x);startNum.setAttribute('y',s0.y);startNum.textContent=String(i+1);
  leadDot.setAttribute('fill',cur.color);leadDot.setAttribute('cx',s0.x);leadDot.setAttribute('cy',s0.y);
  trailEl=mk('polyline',{class:'trail',stroke:cur.dark,points:''});gTrail.appendChild(trailEl);trailPts='';trailBreak=false;
  [...$('strokeDots').children].forEach((d,k)=>d.classList.toggle('on',k<i));
  setStatus('start');
  // finger still down right where the next stroke starts (e.g. L, M, W): keep going without lifting
  if(down&&lastPt&&!demo){tryEngage(lastPt);}
}
function tryEngage(pt){
  const near=nearest(cur,pt,0,START_WIN);
  if(near&&near.d<=TOL){engaged=true;p=Math.max(p,Math.min(near.pt.s,f));addTrail(pt);setStatus('good');return true;}
  return false;
}
let trailBreak=false;
function addTrail(pt){
  if(trailBreak){trailBreak=false;trailEl=mk('polyline',{class:'trail',stroke:cur.dark,points:''});gTrail.appendChild(trailEl);trailPts='';}
  trailPts+=pt.x.toFixed(1)+','+pt.y.toFixed(1)+' ';trailEl.setAttribute('points',trailPts);
}

const MSG={start:['從 ● 開始',''],good:['跟上了！','good'],slow:['慢一點，跟著顏色走','warn'],off:['回到線上喔','bad'],
  lift:['手指放回來','warn'],demo:['看一下怎麼寫','hint'],done:['太棒了！','good']};
function setStatus(key,shake){
  if(key===lastStatusKey&&!shake)return;lastStatusKey=key;
  const m=MSG[key];statusEl.textContent=m[0]===''?'':m[0].replace('●',String(si+1));
  statusEl.className=m[1];
  if(key==='start')statusEl.textContent='從 '+(si+1)+' 開始';
  if(shake){statusEl.classList.remove('shake');void statusEl.offsetWidth;statusEl.classList.add('shake');}
}

// ---------- Tracing ----------
function handlePoint(e,isDown){
  if(demo||letterDone||!cur)return;
  const pt=toSvg(e.clientX,e.clientY);lastPt=pt;
  if(!engaged){if(!tryEngage(pt)){setStatus('start',!!isDown);}return;}
  track(pt,true);
}
// Called on every move AND every frame while the finger is down, so a finger resting ahead of the colour still gets picked up.
let offSince=0, pull=0;
function track(pt,isMove){
  if(!engaged||demo||letterDone||!cur)return;
  const near=nearest(cur,pt,p-BACK,Math.min(cur.L,f+AHEAD));
  pull=0;
  if(near&&near.d<=TOL){
    offSince=0;
    const ahead=near.pt.s>f+0.5;
    p=Math.max(p,Math.min(near.pt.s,f+0.5));
    if(isMove)addTrail(pt);
    setStatus(ahead?'slow':'good');
    if(p>=cur.L-END_SLACK)completeStroke();
    return;
  }
  trailBreak=true;
  const aheadHit=nearest(cur,pt,f,cur.L);
  if(aheadHit&&aheadHit.d<=TOL){offSince=0;pull=aheadHit.pt.s;setStatus('slow');return;}   // on the line but ahead: colour runs on to meet the finger
  const now=performance.now();
  if(!offSince){offSince=now;}
  else if(now-offSince>250){offSince=-1;sfx.boop();setStatus('off',true);}
  if(offSince!==-1)setStatus('off');
}
function completeStroke(){
  gDone.appendChild(mk('path',{d:cur.d,class:'done',stroke:cur.color}));
  curPath.style.strokeDashoffset=cur.L;
  sfx.ding();
  if(si+1>=strokes.length){finishLetter();return;}
  setStroke(si+1);
}
function finishLetter(){
  letterDone=true;startMark.style.display='none';leadG.style.display='none';
  [...$('strokeDots').children].forEach(d=>d.classList.add('on'));
  setStatus('done');sfx.fanfare();
  const c=$('celebrate');c.hidden=false;c.innerHTML='';
  const big=document.createElement('div');big.className='big';big.textContent='太棒了！';c.appendChild(big);
  const sub=document.createElement('div');sub.className='sub';sub.textContent=letterChar()+'  寫好了';c.appendChild(sub);
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='star';s.textContent=['⭐','🌟','✨','🎉'][i%4];
    s.style.left=(5+Math.random()*90)+'%';s.style.top=(Math.random()*30)+'%';s.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(s);}
  const wasDemo=demo;
  clearTimeout(finishLetter.t);
  finishLetter.t=setTimeout(()=>{leadG.style.display='';if(wasDemo){demo=false;hand.style.display='none';resetLetter();}else{nextLetter();}},wasDemo?1200:1900);
}
function resetLetter(){gDone.innerHTML='';gTrail.innerHTML='';letterDone=false;$('celebrate').hidden=true;leadG.style.display='';demo=false;hand.style.display='none';setStroke(0);}
function nextLetter(dir){
  dir=dir||1;
  if(settings.mode==='both'){
    if(dir>0){if(!lower){lower=true;}else{lower=false;idx=pick(dir);}}
    else{if(lower){lower=false;}else{lower=true;idx=pick(dir);}}
  }else{lower=settings.mode==='lower';idx=pick(dir);}
  loadLetter();
}
function pool(){return settings.sel.length?settings.sel.slice().sort((a,b)=>a-b):Array.from({length:26},(_,i)=>i);}
function pick(dir){
  const P=pool();
  if(P.length===1)return P[0];
  if(settings.shuffle){let n;do{n=P[Math.floor(Math.random()*P.length)];}while(n===idx);return n;}
  let k=P.indexOf(idx);
  if(k<0){k=dir>0?P.findIndex(n=>n>idx):P.length-1-P.slice().reverse().findIndex(n=>n<idx);if(k<0||k>=P.length)k=dir>0?0:P.length-1;return P[k];}
  return P[(k+dir+P.length)%P.length];
}

// ---------- Demo ----------
function startDemo(){resetLetter();demo=true;hand.style.display='';demoWait=0;setStatus('demo');}

// ---------- Loop ----------
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(cur&&!letterDone){
    const sp=SPEEDS[settings.speed];
    if(demo){
      if(demoWait>0){demoWait-=dt;}
      else{f=Math.min(cur.L,f+sp*dt);p=f;
        if(f>=cur.L){const more=si+1<strokes.length;completeStroke();if(more)demoWait=.45;}}
    }else{
      const target=Math.min(cur.L,Math.max(p+LEAD,pull));
      if(f<target)f=Math.min(target,f+sp*dt);
      if(down&&lastPt&&engaged)track(lastPt,false);
    }
    if(cur&&!letterDone){
      curPath.style.strokeDashoffset=cur.L-f;
      const q=ptAt(cur,f);leadDot.setAttribute('cx',q.x);leadDot.setAttribute('cy',q.y);
      if(demo){hand.setAttribute('x',q.x);hand.setAttribute('y',q.y);}
      startMark.style.display=engaged||demo?'none':'';
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- Pointer ----------
stage.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;ensureAudio();down=true;try{stage.setPointerCapture(e.pointerId);}catch(x){}handlePoint(e,true);e.preventDefault();});
stage.addEventListener('pointermove',e=>{if(!down||!e.isPrimary)return;handlePoint(e);e.preventDefault();});
function up(e){if(!e.isPrimary)return;down=false;lastPt=null;offSince=0;pull=0;if(engaged&&!letterDone&&!demo)setStatus('lift');}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

// ---------- Audio ----------
let AC=null;
function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(freq,dur,type,vol,when){
  if(!settings.sound||!AC)return;type=type||'sine';vol=vol||.18;when=when||0;
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
const sfx={ding(){tone(880,.15);tone(1320,.22,'sine',.18,.12);},boop(){tone(200,.14,'triangle',.08);},
  fanfare(){[523,659,784,1047].forEach((fq,i)=>tone(fq,.22,'sine',.2,i*.13));tone(1568,.5,'sine',.2,.55);}};
function speak(ch){
  if(!settings.sound||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ch.toUpperCase());u.lang='en-US';u.rate=.8;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}
}

// ---------- Controls ----------
$('prevBtn').onclick=()=>nextLetter(-1);
$('nextBtn').onclick=()=>nextLetter(1);
$('againBtn').onclick=()=>{ensureAudio();resetLetter();};
$('demoBtn').onclick=()=>{ensureAudio();startDemo();};
function seg(id,key,onChange){
  const el=$(id);
  el.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.v===String(settings[key])));
    b.onclick=()=>{settings[key]=key==='speed'?Number(b.dataset.v):b.dataset.v;save();
      el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(onChange)onChange();};});
}
seg('modeSeg','mode',()=>{lower=settings.mode==='lower';loadLetter();});
seg('speedSeg','speed');
function toggleBtn(id,key,on,off){const b=$(id);const r=()=>{b.setAttribute('aria-pressed',String(settings[key]));b.textContent=settings[key]?on:off;};r();
  b.onclick=()=>{settings[key]=!settings[key];save();r();if(key==='sound'&&settings[key])ensureAudio();};}
toggleBtn('shuffleBtn','shuffle','🔀','➡️');
toggleBtn('soundBtn','sound','🔊','🔇');
const grid=$('grid'), gridBtns=[];
for(let i=0;i<26;i++){const b=document.createElement('button');b.innerHTML=String.fromCharCode(65+i)+' <small>'+String.fromCharCode(97+i)+'</small>';
  b.onclick=()=>{const k=settings.sel.indexOf(i);if(k<0)settings.sel.push(i);else settings.sel.splice(k,1);save();renderSel();};grid.appendChild(b);gridBtns.push(b);}
function renderSel(){
  gridBtns.forEach((b,i)=>b.setAttribute('aria-pressed',String(settings.sel.includes(i))));
  const n=settings.sel.length;
  $('gridHint').textContent=n?('已選 '+n+' 個：'+settings.sel.slice().sort((a,b)=>a-b).map(i=>String.fromCharCode(65+i)).join(' ')):'點一下勾選，可以選好幾個；都不選就是全部 26 個。';
  $('gridBtn').textContent=n?('字母表 ('+n+')'):'字母表';
}
$('selAll').onclick=()=>{settings.sel=Array.from({length:26},(_,i)=>i);save();renderSel();};
$('selNone').onclick=()=>{settings.sel=[];save();renderSel();};
function closeGrid(){
  $('gridOverlay').hidden=true;
  const P=pool();
  if(!P.includes(idx)){idx=P[0];lower=settings.mode==='lower';loadLetter();}   // current letter was dropped: jump to the first chosen one
}
$('gridBtn').onclick=()=>{$('gridOverlay').hidden=false;};
$('gridStart').onclick=closeGrid;
$('gridOverlay').addEventListener('click',e=>{if(e.target===$('gridOverlay'))closeGrid();});
renderSel();

lower=settings.mode==='lower';
if(!pool().includes(idx))idx=pool()[0];
loadLetter();
})();
</script>
